<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TipSense - Prediksi Tip Restoran{% endblock %}</title>
  <meta name="description" content="Prediksi besar tip restoran dari total tagihan menggunakan Regresi Linear Sederhana.">

  <!-- Tema diterapkan sebelum halaman tampil agar tidak berkedip -->
  <script>
    (function () {
      document.documentElement.classList.add("js");
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-glass" id="mainNav">
    <div class="container-fluid px-2">
      <a class="navbar-brand brand" href="#beranda">
        <span class="brand-icon"><i class="bi bi-receipt-cutoff"></i></span>
        <span>TipSense</span>
      </a>

      <div class="d-flex align-items-center gap-2 order-lg-3">
        <button class="btn-icon" id="themeToggle" type="button" aria-label="Ganti tema">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <button class="navbar-toggler btn-icon border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Buka menu">
          <i class="bi bi-list fs-4"></i>
        </button>
      </div>

      <div class="collapse navbar-collapse justify-content-center" id="navMenu">
        <ul class="navbar-nav gap-lg-1 py-2 py-lg-0">
          <li class="nav-item"><a class="nav-pill active" href="#beranda" data-section="beranda"><i class="bi bi-house-heart"></i>Beranda</a></li>
          <li class="nav-item"><a class="nav-pill" href="#prediksi" data-section="prediksi"><i class="bi bi-calculator"></i>Prediksi</a></li>
          <li class="nav-item"><a class="nav-pill" href="#grafik" data-section="grafik"><i class="bi bi-graph-up-arrow"></i>Grafik</a></li>
          <li class="nav-item"><a class="nav-pill" href="#cara-kerja" data-section="cara-kerja"><i class="bi bi-lightbulb"></i>Cara Kerja</a></li>
          <li class="nav-item"><a class="nav-pill" href="#model" data-section="model"><i class="bi bi-cpu"></i>Model</a></li>
          <li class="nav-item"><a class="nav-pill" href="#dataset" data-section="dataset"><i class="bi bi-table"></i>Dataset</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="row gy-3 align-items-center">
        <div class="col-md-6">
          <div class="fw-semibold">TipSense &middot; Prediksi Tip Restoran</div>
          <div class="small text-muted-soft">Selsa Shafana Alfiyani &middot; 301240041 &middot; Praktikum Pembelajaran Mesin</div>
        </div>
        <div class="col-md-6 text-md-end">
          
          <a class="footer-link" href="https://github.com/SelsaShaf/TipSense-prediksi-tip-restoran-dengan-regresi-linear.git" target="_blank" rel="noopener"><i class="bi bi-github"></i> GitHub</a>
          <a class="footer-link" href="https://youtu.be/RAcNgG_G8Lg?si=bmeCZmgTiylGkgH-" target="_blank" rel="noopener"><i class="bi bi-youtube"></i> Video Demo</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/extra.js') }}"></script>
</body>
</html>
